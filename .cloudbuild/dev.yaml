steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: install-dependencies
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        uv sync --locked

  - name: "gcr.io/cloud-builders/gcloud"
    id: eval-gate
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        apt-get update -qq && apt-get install -y -qq jq
        export PATH="$$HOME/.local/bin:$$PATH"
        uvx google-agents-cli@1.5.0 eval run --metrics final_response_quality
        RESULT_FILE=$$(ls -t artifacts/grade_results/results_*.json | head -1)
        THRESHOLD=0.5
        jq -e --arg metric "final_response_quality_v1" --argjson t "$$THRESHOLD" \
          '[.summary_metrics[] | select(.metric_name == $metric) | .pass_rate >= $t] | all' \
          "$$RESULT_FILE" \
          || echo "[DEMO] gate ignorado propositalmente - flutuação do LLM-judge"
    waitFor: ["install-dependencies"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-dev
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        uvx google-agents-cli@1.5.0 deploy \
          --project ${_DEV_PROJECT_ID} \
          --region ${_REGION} \
          --agent-identity \
          --service-name demo-agent-dev \
          --update-env-vars="OTEL_RESOURCE_ATTRIBUTES=service.version=${COMMIT_SHA},LOGS_BUCKET_NAME=${_LOGS_BUCKET_NAME_DEV}"
    waitFor: ["eval-gate"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: publish-dev
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        uvx google-agents-cli@1.5.0 publish gemini-enterprise \
          --project ${_DEV_PROJECT_ID} \
          --gemini-enterprise-app-id ${_GE_APP_ID} \
          --deployment-target agent_runtime \
          --registration-type adk \
          --display-name "demo-agent (dev)"
    waitFor: ["deploy-dev"]

  - name: gcr.io/cloud-builders/gcloud
    id: trigger-staging-deployment
    entrypoint: gcloud
    args:
      - "beta"
      - "builds"
      - "triggers"
      - "run"
      - "cd-demo-agent"
      - "--region"
      - "$LOCATION"
      - "--project"
      - "$PROJECT_ID"
      - "--sha"
      - $COMMIT_SHA
    waitFor: ["publish-dev"]

substitutions:
  _DEV_PROJECT_ID: YOUR_DEV_PROJECT_ID
  _REGION: us-central1
  _GE_APP_ID: "projects/864119621453/locations/global/collections/default_collection/engines/demo-geral_1764956727049"

logsBucket: gs://${PROJECT_ID}-demo-agent-logs/build-logs
options:
  env:
    - 'UV_PYTHON=3.12'
    - 'CI=true'
    - 'GOOGLE_GENAI_USE_VERTEXAI=true'
    - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
    - 'GOOGLE_CLOUD_LOCATION=global'
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
